# Kitty Terminal Configuration

# ============================================
# Font Settings
# ============================================
font_family      JetBrains Mono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        13.0

# Disable ligatures when cursor is on them
disable_ligatures cursor

# ============================================
# Cursor
# ============================================
cursor_shape block
cursor_blink_interval 0
cursor_stop_blinking_after 15.0

# ============================================
# Performance
# ============================================
repaint_delay    10
input_delay      3
sync_to_monitor  yes

# ============================================
# Window Settings
# ============================================
remember_window_size  yes
initial_window_width  1400
initial_window_height 900

window_padding_width  4
window_margin_width   0

# Hide title bar on macOS
hide_window_decorations titlebar-only
macos_titlebar_color background

# ============================================
# Tab Bar
# ============================================
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted
tab_title_template "{index}: {title}"

active_tab_foreground   #1e1e2e
active_tab_background   #89b4fa
inactive_tab_foreground #cdd6f4
inactive_tab_background #313244

# ============================================
# Color Scheme - Tokyo Night Storm
# ============================================
foreground #c0caf5
background #24283b

# Black
color0 #1d202f
color8 #414868

# Red
color1 #f7768e
color9 #f7768e

# Green
color2  #9ece6a
color10 #9ece6a

# Yellow
color3  #e0af68
color11 #e0af68

# Blue
color4  #7aa2f7
color12 #7aa2f7

# Magenta
color5  #bb9af7
color13 #bb9af7

# Cyan
color6  #7dcfff
color14 #7dcfff

# White
color7  #a9b1d6
color15 #c0caf5

# Selection colors
selection_foreground #24283b
selection_background #7aa2f7

# ============================================
# Keybindings (macOS style)
# ============================================
# Tabs
map cmd+t new_tab
map cmd+w close_tab
map cmd+shift+] next_tab
map cmd+shift+[ previous_tab
map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5

# Windows
map cmd+enter new_window
map cmd+shift+w close_window
map cmd+shift+f toggle_fullscreen

# Font size
map cmd+equal change_font_size all +1.0
map cmd+minus change_font_size all -1.0
map cmd+0 change_font_size all 0

# Clipboard
map cmd+c copy_to_clipboard
map cmd+v paste_from_clipboard

# ============================================
# macOS Specific
# ============================================
macos_option_as_alt yes
macos_quit_when_last_window_closed yes
macos_show_window_title_in none

# ============================================
# Advanced
# ============================================
allow_remote_control no
shell_integration enabled
term xterm-256color

# Update check
update_check_interval 0

# Confirm close
confirm_os_window_close 0
